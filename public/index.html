<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Competition Concessions | Miamisburg Band &amp; Guard</title>
  <link rel="stylesheet" href="/menu.css" />
</head>
<body>
  <main class="board-shell">
    <header class="board-header">
      <div class="event-mark"><img src="/intertwined-2026.jpg" alt="INTERtwined — Miamisburg Marching Band 2026" /></div>
      <div class="event-headline"><div class="menu-badge">COMPETITION CONCESSIONS</div><div class="booster-title">MIAMISBURG BAND &amp; GUARD</div></div>
    </header>

    <section id="menuGrid" class="menu-grid" aria-live="polite"></section>

    <div class="music-art" aria-hidden="true">
      <span class="staff staff-one"></span>
      <span class="staff staff-two"></span>
      <span class="note n1">♪</span>
      <span class="note n2">♫</span>
      <span class="note n3">♩</span>
      <span class="note n4">♪</span>
      <span class="note n5">♫</span>
      <span class="note n6">♩</span>
      <span class="star s1">★</span>
      <span class="star s2">★</span>
      <span class="star s3">★</span>
    </div>

    <footer class="board-footer">
      <span class="thanks">Thank you for supporting the band &amp; guard!</span>
      <div class="card-notices">
        <span class="card-minimum">$5 Minimum on Credit Card Transactions</span>
        <span class="processing-fee">Card Transactions May Be Charged A 2.6% Processing Fee</span>
      </div>
      <span id="status">Live menu</span>
    </footer>
  </main>
  <script src="/menu.js"></script>
</body>
</html>
